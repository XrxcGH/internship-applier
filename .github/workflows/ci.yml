name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # docs/06 calls this a gate and the script exits non-zero on a finding, but CI
      # mirrored every other step of `npm run check` and left this one out — so a
      # machine-sounding string in UI copy passed here and only failed whoever happened
      # to run the full check locally.
      - name: Audit copy
        run: npm run audit:copy

      - name: Build web
        run: npm run build

      # Release gate — see docs/07-form-automation.md.
      # The tool fills forms; the user submits them. Nothing may click a submit control.
      #
      # grep answers 1 for "found nothing" and 2 for "could not look" — an unreadable or
      # missing path. The old form sent stderr to /dev/null and treated both the same, so
      # renaming apps/server/src would have printed "ok" having scanned no files at all.
      - name: G4 guard — no auto-submit path
        run: |
          if [ ! -d apps/server/src ]; then
            echo "::error::apps/server/src is missing, so the G4 scan checked nothing."
            exit 1
          fi
          status=0
          grep -rniE 'submit[A-Za-z]*\.click|click\(\).*submit' apps/server/src || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Found a submit click in server source. The user submits their own application (G4)."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::grep exited $status, so the G4 scan did not complete."
            exit 1
          fi
          echo "ok — no submit-click found"

      # Gates on high/critical. The one standing moderate finding (esbuild via
      # drizzle-kit) is assessed as unreachable in docs/13-dependency-audit.md;
      # any moderate NOT documented there should be treated as unreviewed.
      - name: Audit dependencies
        run: npm audit --audit-level=high
