name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # docs/06 calls this a gate and the script exits non-zero on a finding, but CI
      # mirrored every other step of `npm run check` and left this one out — so a
      # machine-sounding string in UI copy passed here and only failed whoever happened
      # to run the full check locally.
      - name: Audit copy
        run: npm run audit:copy

      - name: Build web
        run: npm run build

      # Release gate — see docs/07-form-automation.md.
      # The tool fills forms; the user submits them. Nothing may submit one.
      #
      # This was a grep for `submit[A-Za-z]*\.click|click\(\).*submit`, and `click\(\)` in it
      # means literally empty parentheses — so `page.click('button[type=submit]')`, the
      # ordinary Playwright way to submit a form, matched neither alternative and the step
      # printed "ok — no submit-click found". scripts/g4-scan.ts carries the patterns now,
      # self-tests against the submit paths a person would actually write before it reports
      # anything, and exits 2 rather than 0 if it scanned nothing.
      - name: G4 guard — no auto-submit path
        run: npx tsx scripts/g4-scan.ts

      # `ApiErrorCode` promises in its own doc block that every code a route sends is listed
      # there, and twice it wasn't — a client calling ApiError.parse on the reply got a
      # ZodError instead of the code it needed to branch on. The promise is checked now.
      - name: Audit error codes
        run: npx tsx scripts/audit-error-codes.ts

      # Gates on high/critical. The one standing moderate finding (esbuild via
      # drizzle-kit) is assessed as unreachable in docs/13-dependency-audit.md;
      # any moderate NOT documented there should be treated as unreviewed.
      - name: Audit dependencies
        run: npm audit --audit-level=high
